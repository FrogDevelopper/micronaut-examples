services:

  consul:
    image: hashicorp/consul:1.20.6
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    command: "agent -bootstrap"
    volumes:
      - ./consul/server.json:/consul/config/server.json:ro
      - consul_data:/consul/data
    logging:
      driver: "json-file"
      options:
        max-size: "100k"
        max-file: "1"

volumes:
  consul_data:
